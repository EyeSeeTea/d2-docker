# Postgres settings for the d2-docker db container.
#
# These values are passed as command-line options (-c name=value), so they
# override the postgresql.conf of the image; any setting not listed here keeps
# the image default. Use a copy of this file with: d2-docker start --postgres-conf=FILE
#
# Check the active values (and their source) with:
#   SELECT name, setting, unit, source FROM pg_settings WHERE source <> 'default';

max_connections = 250
max_locks_per_transaction = 100
shared_buffers = 3200MB
work_mem = 24MB
maintenance_work_mem = 1024MB
effective_cache_size = 8000MB
temp_buffers = 16MB
checkpoint_completion_target = 0.8
synchronous_commit = off
wal_writer_delay = 10000ms
random_page_cost = 1.1
track_activity_query_size = 8192
jit = off  # Postgres >= 11 only, remove for older versions
